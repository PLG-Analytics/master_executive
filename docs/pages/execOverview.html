<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Qlik Web Components library -->
    <script
        src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components/dist/index.min.js"
        type="application/javascript"
        data-host="https://pondlehocky.us.qlikcloud.com"
        data-client-id="019ed7386b4d654809b0cc31effbd1d7"
        data-redirect-uri="https://plg-analytics.github.io/master_executive/oauth-callback.html"
        data-auth-type="Oauth2"
        data-web-integration-id="uf8UGUYKg4vvpHxhI3eMavSK0n9zIGc5"
        data-access-token-storage="local">
    </script>

    <!-- Custom styles and scripts -->
    <link rel="stylesheet" href="https://plg-analytics.github.io/master_executive/css/styles.css">
    <link rel="stylesheet" href="https://plg-analytics.github.io/master_executive/css/jumbotron.css">

    <script src="https://plg-analytics.github.io/master_executive/js/utils.js"></script>
    <script src="https://plg-analytics.github.io/master_executive/js/qlik.js"></script>

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
</head>


<!-- Data Context Popup -->
<div id="dataContextModal" class="modal hidden">
    <div class="modal-context">
        <span class="close-modal" onclick="closeDataContext()">&times;</span>
        <h3>Data Context</h3>

        <div class="data-context-list">
            <p><strong>Litify Go-Live:</strong> Washington and NJ WC were onboarded in June 2026.</p>
            <p><strong>HC</strong> Headcount is updated monthly.</p>
            <p><strong>Washington & NJ WC:</strong> Cases are deduplicated between DearLegal, CX, and Litify.</p>
        </div>
    </div>
</div>


<body> 
    <div class="dashboard-content">
        <!-- Waffle button -->
        <div class="waffle-button" onclick="toggleWaffle()">☰</div>
        <div id="waffle-container"></div>

        <div id="divLogo">   <img src="https://plg-analytics.github.io/master_executive/Images/PL.png" alt="PLG Logo" id="imgLogo">   </div>

        <h1> Jumbotron </h1>

        <div class="toolbar">
            <button id="btnClear" class="hidden" onclick="clearFilters()"> Clear All Filters </button>
            <button id="btnDataContext" class="hidden" onclick="openDataContext()"> Data Context </button>
        </div>

        <div id="divFilterBar"></div>

        <!-- will serve as the container for the Qlik charts -->
        <div class="overview-container" id="overviewContainer"></div>

        <div class="nav-arrows">
            <div id="backArrow" class="nav-arrow nav-arrow-back"> 
                <span class="nav-icon">❮</span> 
                <span class="nav-label">Home</span>
            </div>

            <div id="nextArrow" class="nav-arrow nav-arrow-next">
                <span class="nav-label">Global Inventory</span> 
                <span class="nav-icon">❯</span>
            </div>
        </div>

    </div>


<script> 
    initWaffle();

    // Get references to the container, clear button, and navigation arrows
    const container = document.getElementById("overviewContainer");
    const btnClear = document.getElementById("btnClear");
    const btnDataContext = document.getElementById("btnDataContext");
    const nextArrow = document.getElementById("nextArrow");
    const backArrow = document.getElementById("backArrow");
    let appId = "85e0e56a-1e2b-4cbf-8a87-ff3a884f2776";  // Qlik App ID

    // Wait for Qlik to finish authorizing the user before showing relevant UI elements
    async function waitForQlikAuth() {

        await customElements.whenDefined("qlik-embed");

        const tryBind = async () => {
        const embed = document.querySelector("qlik-embed");
        if (!embed) return;

        try {
            const refApi = await embed.getRefApi();
            const doc = await refApi.getDoc();

            if (doc) {
            console.log("Qlik authorized");

            btnClear.classList.remove("hidden");
            btnDataContext.classList.remove("hidden");  
            backArrow.classList.add("ready");

            backArrow.onclick = () => { window.location.href = "../index.html"; };
            nextArrow.classList.add("ready");
            nextArrow.onclick = () => { window.location.href = "inv.html"; };

            document.querySelector(".waffle-button").classList.remove("hidden");
            document.getElementById("waffle-container").classList.remove("hidden");

            document.querySelectorAll(".pivot-wrapper, .kpi-wrapper, .jumbotron-wrapper, .break-wrapper, .fullscreen-btn").forEach(el => {
                el.classList.remove("hidden");
                el.classList.add("ready");
            });


            return true;
            }
        } catch (err) {
            console.log("Error:", err);
        }

        return false;
        };

        const interval = setInterval(async () => {
        const success = await tryBind();
        if (success) clearInterval(interval);
        }, 500);
    }

    //  render of the KPIs and Jumbotron chart
    function renderDashboard() {    
        let kpiActiveInv = createChart( appId, "0332fafa-7747-42af-bcf9-58d0b577ff5c");
        let kpiMoMInv = createChart( appId, "6381c2ac-28fd-432d-92a5-795d42ac754b");
        let kpiAttyHc = createChart( appId, "fcd3e50e-b657-432b-817c-12ca21967eff");
        let kpiAttyInv = createChart( appId, "WjeLGM");
        let kpiStaffHc = createChart( appId, "beb8256c-74cd-4be2-b962-3f0e99c19869");  
        let kpiStaffInv = createChart( appId, "CUvep"); 

        const kpiRow = document.createElement("div");
        kpiRow.classList.add("kpi-row");

        // add the KPIs to the row
        kpiRow.appendChild(wrapper(kpiActiveInv, "kpi-wrapper",0));
        kpiRow.appendChild(wrapper(kpiMoMInv, "kpi-wrapper",0));
        kpiRow.appendChild(wrapper(kpiAttyHc, "kpi-wrapper",0));
        kpiRow.appendChild(wrapper(kpiAttyInv, "kpi-wrapper",0));
        kpiRow.appendChild(wrapper(kpiStaffHc, "kpi-wrapper",0));
        kpiRow.appendChild(wrapper(kpiStaffInv, "kpi-wrapper",0));

        container.appendChild(kpiRow);

        // add the main jumbotron chart (performance month)
        let newJumbotron = createChart( appId, "NnrNa");
        container.appendChild(wrapper(newJumbotron, "jumbotron-wrapper",1));

        // keep reference updated
        chrtJumbotron = newJumbotron;

        // Load in Funnel Analytics
        let funnelBreak = createChart( appId, "d2ddb708-6b50-421a-a8ea-7e9ba1dca43b"); 
        container.appendChild(wrapper(funnelBreak, "break-wrapper",0));

        const funnelSection = document.createElement("div");
        funnelSection.classList.add("funnel-section");

        // Add toggle button for pivots
        const pivotToggleBtn = document.createElement("button");
        pivotToggleBtn.id = "btnPivotToggle";
        pivotToggleBtn.className = "pivot-toggle-btn";
        pivotToggleBtn.textContent = "Expand All";
        pivotToggleBtn.addEventListener("click", togglePivot);
        container.appendChild(pivotToggleBtn);

        const funnelRow1 = document.createElement("div");
        funnelRow1.classList.add("funnel-row");
        let pivotFunnelWC = createChart( appId, "367e6ff1-36bb-4991-8def-bb09be548ca6"); 
        let pivotFunnelSSD = createChart( appId, "e911d87e-c55b-4c73-a692-42cab430555f"); 
        funnelRow1.appendChild(wrapper(pivotFunnelWC, "pivot-wrapper",1));
        funnelRow1.appendChild(wrapper(pivotFunnelSSD, "pivot-wrapper",1));

        const funnelRow2 = document.createElement("div");
        funnelRow2.classList.add("funnel-row");
        let pivotFunnelRef = createChart( appId, "37eb0fec-9c0a-487e-8f93-80a0cfe912f4"); 
        let pivotFunnelNJ = createChart( appId, "cabae542-2c25-462a-b8d1-ff7824f1784e"); 
        funnelRow2.appendChild(wrapper(pivotFunnelRef, "pivot-wrapper",1));
        funnelRow2.appendChild(wrapper(pivotFunnelNJ, "pivot-wrapper",1));

        funnelSection.appendChild(funnelRow1);
        funnelSection.appendChild(funnelRow2);

        container.appendChild(funnelSection);

        // set up filter bar
        const selectionWrapper = document.createElement("div"); // create wrapper for formating 
        selectionWrapper.classList.add("filter-bar-wrapper");

        const selectionBar = createSelectionBar(appId); // create selection bar with unique identity
        selectionWrapper.appendChild(selectionBar);
        document.getElementById("divFilterBar").appendChild(selectionWrapper);
    }

    // render the dashboards, set the state for pivots accordingly
    (async () => {
        renderDashboard();

        await waitForQlikAuth();
        await waitForPivotMenus();

        await initializePivotButton();

    })();


// Clear filters and re-render the chart with a new identity
    async function clearFilters() {
        const embed = document.querySelector('#divFilterBar qlik-embed');

        if (embed) {
            const refApi = await embed.getRefApi();
            const app = await refApi.getDoc();

            await app.clearAll();
        }
    }

    function openDataContext() {
        document.getElementById("dataContextModal")
            .classList.remove("hidden");
    }

    function closeDataContext() {
        document.getElementById("dataContextModal")
            .classList.add("hidden");
    }

    let pivotsExpanded = false;
    // Expand the pivot tables entirely
    async function expandMenu(menu) {

        menu.click();

        await new Promise(r => setTimeout(r, 50));

        document.querySelectorAll('[role="menu"]').forEach(el => {
            el.style.display = 'none';
        });

        const expandItem =
            [...document.querySelectorAll('li[role="menuitem"]')]
                .find(li => li.textContent.trim() === 'Expand');

        expandItem?.click();

        await new Promise(r => setTimeout(r, 140));
    }

    // Collapse the pivot tables entirely
    async function collapseMenu(menu) {

        menu.click();

        await new Promise(r => setTimeout(r, 50));

        document.querySelectorAll('[role="menu"]').forEach(el => {
            el.style.display = 'none';
        });

        const collapseItem =
            [...document.querySelectorAll('li[role="menuitem"]')]
                .find(li => li.textContent.trim() === 'Collapse');

        collapseItem?.click();

        await new Promise(r => setTimeout(r, 140));
    }
    
    // wait till all pivots have been loaded
    async function waitForPivotMenus() {

        while (
            document.querySelectorAll(
                '.nebula-table-utils-head-menu-wrapper'
            ).length < 9
        ) {
            await new Promise(r => setTimeout(r, 250));
        }
    }
    
    // initialize all pivots in the initial load based on the current state
    async function initializePivotButton() {

        // Wait for Qlik to finish rendering
        await new Promise(r => setTimeout(r, 150));

        const count = document.querySelectorAll(
            '.nebula-table-utils-head-menu-wrapper'
        ).length;

        console.log("Final menu count:", count);

        const btn = document.getElementById("btnPivotToggle");

        if (count >= 18) {
            pivotsExpanded = true;
            btn.textContent = "Collapse All";
            btn.style.backgroundColor = "#d9534f";

        } else {
            pivotsExpanded = false;
            btn.textContent = "Expand All";
            btn.style.backgroundColor = "#0097ce";
        }
    }
    
    // Handle the toggle and format of the button
    async function togglePivot() {
        document.getElementById("btnPivotToggle").disabled = true; // add disabled property to prevent multiple clicks

        document.body.classList.add("hide-pivot-menu");

        try {

            let menus = [...document.querySelectorAll(
                '.nebula-table-utils-head-menu-wrapper'
            )];

            if (!pivotsExpanded) {

                for (let i = 8; i < menus.length; i++) {
                    await expandMenu(menus[i]);
                }

                menus = [...document.querySelectorAll(
                    '.nebula-table-utils-head-menu-wrapper'
                )];

                for (let i = 8; i < menus.length; i++) {
                    await expandMenu(menus[i]);
                }

                document.getElementById("btnPivotToggle").textContent =  "Collapse All";
                document.getElementById("btnPivotToggle").style.backgroundColor = "#d9534f";
                pivotsExpanded = true;

            } else {

                for (let i = 8; i < menus.length; i++) {
                    await collapseMenu(menus[i]);
                }

                menus = [...document.querySelectorAll(
                    '.nebula-table-utils-head-menu-wrapper'
                )];

                for (let i = 8; i < menus.length; i++) {
                    await collapseMenu(menus[i]);
                }

                document.getElementById("btnPivotToggle").textContent = "Expand All";
                document.getElementById("btnPivotToggle").style.backgroundColor = "#0097ce";
                pivotsExpanded = false;
            }

        } finally {
            document.querySelectorAll('.MuiPopover-root').forEach(el => {
                el.remove();
            });

            document.querySelectorAll('.MuiMenu-root').forEach(el => {
                el.remove();
            });

            document.body.classList.remove("hide-pivot-menu");

            document.getElementById("btnPivotToggle").disabled = false; // removed disabled property
        }
    }

</script>

</body>
</html>
