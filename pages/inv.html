  <script

    data-redirect-uri="http://127.0.0.1:5500/pages/oauth-callback.html"
    data-auth-type="Oauth2"
    data-web-integration-id ="uf8UGUYKg4vvpHxhI3eMavSK0n9zIGc5" >

  <style>
    .inv-container {
    width: 100%;
    position: relative;
    }

    .filter-row-wrapper {
        width: 100%;
        height: 75px;
        margin-bottom: 10px;
        display: block;
    }

    .filter-row-wrapper qlik-embed {
        width: 100%;
        height: 100%;
        display: block;
    }

    .inv-charts-wrapper {
        width: calc(100% - 270px);
        height: 450px;
    }

    .inv-charts-wrapper qlik-embed {
        width: 100%;
        height: 100%;
        display: block;
    }
   
    .content-row {
        display: flex;
        gap: 20px;
        width: 100%;
        align-items: flex-start;
    }

    .filter-row-wrapper {
        width: 250px;
        height: 450px;
        flex-shrink: 0;
    }

    </style>

</head>

<body>
  
  <div class="dashboard-content">
    <div class="waffle-button hidden" onclick="toggleWaffle()">☰</div>

        <!-- Waffle menu container -->
    <div id="waffle-container" class="hidden"></div>
        
    <div id="divLogo"><img src="/Images/PL.png" alt="PLG Logo" id="imgLogo"> </div> 

    <h1> Inventory Reports</h1>

    <div class="toolbar">
        <button id="btnClear" class="hidden" onclick="clearFilters()">  Clear All Filters  </button>
    </div>

    <!-- will serve as the container for the Qlik charts -->
    <div class="inv-container" id="inv-container"></div>

    <div class="nav-arrows">
        <div id="backArrow" class="nav-arrow nav-arrow-back">❮</div>
        <div id="nextArrow" class="nav-arrow nav-arrow-next">❯</div>
    </div>
</div>



  <script> 
    initWaffle();

    // Get references to the container, clear button, and navigation arrows
    const container = document.getElementById("inv-container");
    const btnClear = document.getElementById("btnClear");
    const nextArrow = document.getElementById("nextArrow");
    const backArrow = document.getElementById("backArrow");

     // Wait for Qlik to finish authorizing the user before showing relevant UI elements
    async function waitForQlikAuth() {
        const actionBtn = document.getElementById("btnClear");

        await customElements.whenDefined("qlik-embed");

        const tryBind = async () => {
        const embed = document.querySelector("qlik-embed");
        if (!embed) return;

        try {
            const refApi = await embed.getRefApi();
            const doc = await refApi.getDoc();

            if (doc) {
                console.log("Qlik authorized");

                btnClear.classList.remove("hidden");  
                backArrow.classList.add("ready");

                backArrow.onclick = () => { window.location.href = "execOverview.html"; };
                nextArrow.classList.add("ready");
                nextArrow.onclick = () => { window.location.href = "template.html"; };

                document.querySelector(".waffle-button").classList.remove("hidden");
                document.getElementById("waffle-container").classList.remove("hidden");

                document.querySelectorAll(".filter-row-wrapper, .inv-charts-wrapper").forEach(el => {
                    el.classList.remove("hidden");
                    el.classList.add("ready");
            });

                return true;
            }
        } catch (err) {
            console.log("Error:", err);
        }

        return false;
        };

        const interval = setInterval(async () => {
        const success = await tryBind();
        if (success) clearInterval(interval);
        }, 500);
    }

    //  render the dashboard with the appropriate Qlik charts for this page
    function renderDashboard() {
        let appId = "f56e3dde-fcdd-4fdd-b5fb-f49440ac9d3f";  // Qlik App ID

        // dept filter
        let deptFilter = createChart("session-" + Date.now(), appId, "757d908e-3f3d-499f-bb81-94cc80fbc00a");     
        const contentRow = document.createElement("div");
        contentRow.classList.add("content-row");

        // filter
        contentRow.appendChild(wrapper(deptFilter, "filter-row-wrapper"));

        // chart 
        let invCharts = createChart("session-" + Date.now(), appId, "7dc1a579-ba00-4b2a-867a-429e068cad1a" ); // container for the charts
        contentRow.appendChild(wrapper(invCharts, "inv-charts-wrapper"));

        container.appendChild(contentRow);

        waitForQlikAuth();
    }

    renderDashboard();

    //  Clear filters and re-render the chart with a new identity
    function clearFilters() {
        btnClear.classList.add("hidden");

        setTimeout(() => {
        container.innerHTML = "";   // clear everything
        renderDashboard();          // re-render fresh session
        }, 150);
    }

  </script>

</body>
