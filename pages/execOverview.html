<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Qlik Web Components library -->
  <script src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components/dist/index.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/utils.js"></script>
  
  <style>
    .overview-container {
        width: 100%; 
        position: relative;
    }

    /* Styling the KPI row to display KPIs in a horizontal layout with spacing */
    .kpi-row {
        display: flex;
        gap: 15px;
    }
    
    /* Styling the KPI wrapper to ensure each KPI has a consistent size and layout */
    .kpi-wrapper {
        flex: 1 1 0;
        min-width: 0;       
        height: 150px;
        border: 1px solid #d3d3d3;
        box-shadow: 0 2px 6px rgba(0,0,0,.10);
        background: #fff;
    }

    /* Ensuring that the Qlik embed component within the KPI wrapper takes up the full space of its parent */
    .kpi-wrapper qlik-embed {
        width: 100%;
        height: 100%;       
    }

    .njs-cell-footer {
        background-color: transparent !important;
        font-style: italic !important;
    }

    .jumbotron-wrapper {
        width: 100%;
        height: 450px; 
        margin-bottom: 10px;
        margin-top: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,.10);
    }

    .jumbotron-wrapper qlik-embed {
        width: 100%;
        height: 100%;
    }

    /* Styling the KPI row to display KPIs in a horizontal layout with spacing */
    .funnel-row {
        display: flex;
        gap: 15px;
        height: 400px;
        margin-bottom: 15px; 
        margin-top: 15px;
    }
    
    /* Styling the KPI wrapper to ensure each KPI has a consistent size and layout */
    .pivot-wrapper {  
        flex: 1;
        min-width: 0;       
        height: 100%;   
        display: flex;      
        overflow: hidden;
        border: none;
        position: relative;
    }
  
    .pivot-wrapper.ready {
        border: 1px solid #d3d3d3;
        box-shadow: 0 2px 6px rgba(0,0,0,.10);
        background: #fff;
 
    }

    .pivot-wrapper qlik-embed  {
        width: 100%;
        height: 100%;
    }

    /* Full screen button styling  - used by funnel analytics*/
    .fullscreen-btn {
        position: absolute;
        top: 2%;
        right: 1.2%;
        z-index: 1000;

        background: transparent;
        border: none;
        padding: 0;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .fullscreen-btn img {
        width: 25px;
        height: 25px;
    }

    .pivot-wrapper.browser-fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        background: white;
        padding: 1.5%;
        box-sizing: border-box;
        border: none !important;
    }

    /* Adjusting font size and padding for pivot charts to improve readability */
    .pivot-wrapper [data-section-id="GRID"] * {
        font-size: 15.5px !important;
    }

  </style>

  
  <script
    data-host="https://pondlehocky.us.qlikcloud.com"
    data-client-id="019ed7386b4d654809b0cc31effbd1d7"
    data-redirect-uri="http://127.0.0.1:5500/pages/oauth-callback.html"
    data-auth-type="Oauth2"
    data-web-integration-id ="uf8UGUYKg4vvpHxhI3eMavSK0n9zIGc5" >
  </script>

</head>

<body> 
    <div class="dashboard-content">
        <!-- Waffle button -->
        <div class="waffle-button hidden" onclick="toggleWaffle()">☰</div>

        <!-- Waffle menu container -->
        <div id="waffle-container" class="hidden"></div>

        <div id="divLogo"><img src="/Images/PL.png" alt="PLG Logo" id="imgLogo"> </div>  

        <h1> Jumbotron </h1>

        <div class="toolbar">
            <button id="btnClear" class="hidden" onclick="clearFilters()"> Clear All Filters </button>
        </div>

        <!-- will serve as the container for the Qlik charts -->
        <div class="overview-container" id="overviewContainer"></div>

        <div class="nav-arrows">
            <div id="backArrow" class="nav-arrow nav-arrow-back"> 
                <span class="nav-icon">❮</span> 
                <span class="nav-label">Home</span>
            </div>

            <div id="nextArrow" class="nav-arrow nav-arrow-next">
                <span class="nav-label">Inventory Reports</span> 
                <span class="nav-icon">❯</span>
            </div>
        </div>

    </div>


<script> 
    initWaffle();

    // Get references to the container, clear button, and navigation arrows
    const container = document.getElementById("overviewContainer");
    const btnClear = document.getElementById("btnClear");
    const nextArrow = document.getElementById("nextArrow");
    const backArrow = document.getElementById("backArrow");
  
    // Wait for Qlik to finish authorizing the user before showing relevant UI elements
    async function waitForQlikAuth() {
        const actionBtn = document.getElementById("btnClear");

        await customElements.whenDefined("qlik-embed");

        const tryBind = async () => {
        const embed = document.querySelector("qlik-embed");
        if (!embed) return;

        try {
            const refApi = await embed.getRefApi();
            const doc = await refApi.getDoc();

            if (doc) {
            console.log("Qlik authorized");

            btnClear.classList.remove("hidden");  
            backArrow.classList.add("ready");

            backArrow.onclick = () => { window.location.href = "index.html"; };
            nextArrow.classList.add("ready");
            nextArrow.onclick = () => { window.location.href = "inv.html"; };

            document.querySelector(".waffle-button").classList.remove("hidden");
            document.getElementById("waffle-container").classList.remove("hidden");

            
            document.querySelectorAll(".pivot-wrapper, .kpi-wrapper, .jumbotron-wrapper, .break-wrapper, .fullscreen-btn").forEach(el => {
                el.classList.remove("hidden");
                el.classList.add("ready");
            });


            return true;
            }
        } catch (err) {
            console.log("Error:", err);
        }

        return false;
        };

        const interval = setInterval(async () => {
        const success = await tryBind();
        if (success) clearInterval(interval);
        }, 500);
    }

    // Add a full screen button to pivot charts
    function addFullscreenButton(wrapperElement) {
        const btn = document.createElement("button");
        btn.className = "fullscreen-btn hidden";
        btn.title = "Full Screen";

        // Create icon
        const icon = document.createElement("img");
        icon.src = "../Images/expand.png";     // adjust path if needed
        icon.alt = "Expand";

        btn.appendChild(icon);

        btn.addEventListener("click", (e) => {
            e.stopPropagation();

            wrapperElement.classList.toggle("browser-fullscreen");

            if (wrapperElement.classList.contains("browser-fullscreen")) {
                icon.src = "../Images/collapse.png";
                icon.alt = "Collapse";
                btn.title = "Restore Size";
            } else {
                icon.src = "../Images/expand.png";
                icon.alt = "Expand";
                btn.title = "Full Screen";
            }
        });

        wrapperElement.appendChild(btn);
    }

    // Create a wrapper around a Qlik chart
    function wrapper(chart, className) {
        const div = document.createElement("div");

        div.classList.add(className);
        div.appendChild(chart);

        // Only add the full screen option to pivot charts
        if (className === "pivot-wrapper") {
            addFullscreenButton(div);
        }

        return div;
    }

    //  render of the KPIs and Jumbotron chart
    function renderDashboard() {
        let appId = "85e0e56a-1e2b-4cbf-8a87-ff3a884f2776";  // Qlik App ID
        const sessionId = "session-" + Date.now();

        let kpiActiveInv = createChart(sessionId, appId, "0332fafa-7747-42af-bcf9-58d0b577ff5c");
        let kpiMoMInv = createChart(sessionId, appId, "6381c2ac-28fd-432d-92a5-795d42ac754b");
        let kpiAttyHc = createChart(sessionId, appId, "fcd3e50e-b657-432b-817c-12ca21967eff");
        let kpiAttyInv = createChart(sessionId, appId, "WjeLGM");
        let kpiStaffHc = createChart(sessionId, appId, "beb8256c-74cd-4be2-b962-3f0e99c19869");  
        let kpiStaffInv = createChart(sessionId, appId, "CUvep"); 

        const kpiRow = document.createElement("div");
        kpiRow.classList.add("kpi-row");

        // add the KPIs to the row
        kpiRow.appendChild(wrapper(kpiActiveInv, "kpi-wrapper"));
        kpiRow.appendChild(wrapper(kpiMoMInv, "kpi-wrapper"));
        kpiRow.appendChild(wrapper(kpiAttyHc, "kpi-wrapper"));
        kpiRow.appendChild(wrapper(kpiAttyInv, "kpi-wrapper"));
        kpiRow.appendChild(wrapper(kpiStaffHc, "kpi-wrapper"));
        kpiRow.appendChild(wrapper(kpiStaffInv, "kpi-wrapper"));

        container.appendChild(kpiRow);

        // add the main jumbotron chart (performance month)
        let newJumbotron = createChart(sessionId, appId, "NnrNa");
        container.appendChild(wrapper(newJumbotron, "jumbotron-wrapper"));

        // keep reference updated
        chrtJumbotron = newJumbotron;

        // Load in Funnel Analytics
        let funnelBreak = createChart(sessionId, appId, "d2ddb708-6b50-421a-a8ea-7e9ba1dca43b"); 
        container.appendChild(wrapper(funnelBreak, "break-wrapper"));

        
        const funnelSection = document.createElement("div");
        funnelSection.classList.add("funnel-section");

        const funnelRow1 = document.createElement("div");
        funnelRow1.classList.add("funnel-row");
        let pivotFunnelWC = createChart(sessionId, appId, "367e6ff1-36bb-4991-8def-bb09be548ca6"); 
        let pivotFunnelSSD = createChart(sessionId, appId, "e911d87e-c55b-4c73-a692-42cab430555f"); 
        funnelRow1.appendChild(wrapper(pivotFunnelWC, "pivot-wrapper"));
        funnelRow1.appendChild(wrapper(pivotFunnelSSD, "pivot-wrapper"));

        const funnelRow2 = document.createElement("div");
        funnelRow2.classList.add("funnel-row");
        let pivotFunnelRef = createChart(sessionId, appId, "37eb0fec-9c0a-487e-8f93-80a0cfe912f4"); 
        let pivotFunnelNJ = createChart(sessionId, appId, "cabae542-2c25-462a-b8d1-ff7824f1784e"); 
        funnelRow2.appendChild(wrapper(pivotFunnelRef, "pivot-wrapper"));
        funnelRow2.appendChild(wrapper(pivotFunnelNJ, "pivot-wrapper"));

        funnelSection.appendChild(funnelRow1);
        funnelSection.appendChild(funnelRow2);

        container.appendChild(funnelSection);

        waitForQlikAuth();
    }

    // Initialize the dashboard by creating a hidden chart for authentication and then rendering the dashboard
    async function initializeDashboard() {
        // Create a hidden chart used only for authentication
        const authChart = createChart(
            "auth-session",
            "85e0e56a-1e2b-4cbf-8a87-ff3a884f2776",
            "0332fafa-7747-42af-bcf9-58d0b577ff5c"
        );

        authChart.style.display = "none";
        document.body.appendChild(authChart);

        await customElements.whenDefined("qlik-embed");

        try {
            const refApi = await authChart.getRefApi();
            await refApi.getDoc();

            console.log("Qlik authorized");
            authChart.remove();

            renderDashboard();
        }
        catch (err) {
            console.error("Qlik authentication failed:", err);
        }
    }
    
    initializeDashboard();

    // Clear filters and re-render the chart with a new identity
    function clearFilters() {
        btnClear.classList.add("hidden");

        setTimeout(() => {
        container.innerHTML = "";   // clear everything
        renderDashboard();          // re-render fresh session
        }, 150);
    }

</script>

</body>
</html>
