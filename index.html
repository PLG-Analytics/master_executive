  <link rel="stylesheet" href="styles.css">

  <!-- Qlik embed (handles OAuth) -->
  <script
    data-host="https://pondlehocky.us.qlikcloud.com"
    data-client-id="019ed7386b4d654809b0cc31effbd1d7"
    data-redirect-uri="http://127.0.0.1:5500/oauth-callback.html"
    data-auth-type="Oauth2"
    data-web-integration-id ="uf8UGUYKg4vvpHxhI3eMavSK0n9zIGc5" >
  </script>
</head>

<body>


<div id="hiddenContent" class="hidden">
    <div id="nextArrow" class="nav-arrow nav-arrow-next">❯</div> 
    <div id="divLogo"><img src="Images/PL.png" alt="PLG Logo" id="imgLogo"> </div>
    <h1>Master Executive Report</h1>
    <h2>Table of Contents</h2>
    <ul>
        <li><a href="/jumbotron.html">Jumbotron</a></li>
        <li>TEST Section 2</li>
        <li>TEST Section 3</li>
    </ul>

    <h2>Assumptions</h2>
    <ul>
        <li>Data refreshed daily</li>
        <li>Stage Assumptions</li>
    </ul>
</div>

<qlik-embed
  id="authEmbed"
  ui="analytics/chart"
  app-id="f56e3dde-fcdd-4fdd-b5fb-f49440ac9d3f"
  object-id="2c6dff8c-d1c0-4add-b001-07ab374ad255" >
</qlik-embed>


<script>

// once authentication is complete, show the hidden content and enable navigation to the next page
async function initAuth() {
  const embed = document.getElementById("authEmbed"); 
  const arrow = document.getElementById("nextArrow");

  await customElements.whenDefined("qlik-embed");

  const checkAuth = async () => {
    try {
      const refApi = await embed.getRefApi();
      const doc = await refApi.getDoc();

      if (doc) {
        console.log("Auth complete");

        // show hidden content AFTER auth
        document.getElementById("hiddenContent").classList.remove("hidden");
        document.getElementById("authEmbed").classList.add("hidden");

        arrow.classList.add("ready");

        arrow.onclick = () => {
          window.location.href = "jumbotron.html";
        };

        return true;
      }
    } catch {}

    return false;
  };

  const interval = setInterval(async () => {
    if (await checkAuth()) clearInterval(interval);
  }, 500);
}

initAuth();
</script>

</body>
</html>
