<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Qlik Web Components library -->
  <script src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components/dist/index.min.js"></script>

  <style>
    .viz-container {
      width: 100%;
      height: 900px;
      position: relative;
    }

    qlik-embed {
      width: 100%;
      height: 100%;
      display: block;
      transition: opacity 0.2s ease;
    }

    .toolbar {
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<h2> Jumbotron Report</h2>

<div class="toolbar">
  <button id="clearBtn" class="hidden" onclick="clearFilters()">
    Clear All Filters
  </button>
</div>

<div class="viz-container" id="container"></div>

<script>
  const container = document.getElementById("container");
  const clearBtn = document.getElementById("clearBtn");

  function createChart(identity) {
    const embed = document.createElement("qlik-embed");

    embed.setAttribute("ui", "analytics/chart");
    embed.setAttribute("app-id", "f56e3dde-fcdd-4fdd-b5fb-f49440ac9d3f");
    embed.setAttribute("object-id", "1c7b6c1d-d436-44e3-84b5-c3850e7ff2f7");
    embed.setAttribute("host", "pondlehocky.us.qlikcloud.com");
    embed.setAttribute("redirect-uri", "http://127.0.0.1:5500/oauth-callback.html");
    embed.setAttribute("client-id", "019ed7386b4d654809b0cc31effbd1d7");
    embed.setAttribute("web-integration-id", "uf8UGUYKg4vvpHxhI3eMavSK0n9zIGc5");
    embed.setAttribute("identity", identity); // reset identity to force a new session so that filters are cleared

    // hide 'Clear All Filters' button until authorization is complete 
    setTimeout(() => {
      clearBtn.classList.remove("hidden"); }, 1500); 

    return embed;
  }

  // ✅ Initial render
  let currentEmbed = createChart("session-" + Date.now());
  container.appendChild(currentEmbed);

  // ✅ Clear (reset chart)
  function clearFilters() {
    clearBtn.classList.add("hidden");

    const newEmbed = createChart("session-" + Date.now());

    currentEmbed.style.opacity = "0.2";

    setTimeout(() => {
      container.replaceChild(newEmbed, currentEmbed);
      currentEmbed = newEmbed;
    }, 150);
  }
</script>

</body>
</html>
